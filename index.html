<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102c40">
  <title>修好这条路 · 城市复线 0.3.0</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102c40}canvas{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px);display:block;width:100%;height:100%;height:100dvh;touch-action:none}</style>
</head>
<body>
  <canvas id="game" aria-label="修好这条路：点击道路旋转，橙色岔口切换方向，完成后发车。"></canvas>
  <script type="module">
    import {createBrowserPlatform} from './adapters/browser.js';
    import {startGame} from './src/canvas-game.js';
    const audioPaths=Object.fromEntries(['turn','switch','send','win','error'].map(key=>[key,'./assets/tap.wav']));
    const platform=createBrowserPlatform(document.getElementById('game'),window,audioPaths);
    const game=startGame(platform);
    // Read-only snapshots help repeatable developer QA; no gameplay state setter.
    window.roadDemo={getSnapshot:game.getSnapshot};
    window.addEventListener('pagehide',event=>{if(!event.persisted){game.destroy();platform.destroy();}});
  </script>
</body>
</html>
