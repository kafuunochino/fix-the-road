// Platform-neutral reward gate. Live is deliberately disabled unless explicitly
// enabled with a real unit and verified no-share fallback configuration.
function createRewardedService({mode='disabled',api=null,adUnitId='',shareFallbackDisabled=false,timers={}}={}) {
  const setTimer=timers.setTimeout||(typeof globalThis.setTimeout==='function'?globalThis.setTimeout.bind(globalThis):()=>null),clearTimer=timers.clearTimeout||(typeof globalThis.clearTimeout==='function'?globalThis.clearTimeout.bind(globalThis):()=>{});
  let active=null,serial=0,destroyed=false,retiring=false,retireFailed=false;
  const liveReady=mode==='live'&&api&&typeof api.createRewardedVideoAd==='function'&&typeof adUnitId==='string'&&adUnitId.trim().length>0&&!/placeholder|YOUR_|test|mock|xxxx/i.test(adUnitId)&&shareFallbackDisabled===true;
  const actualMode=mode==='mock'?'mock':liveReady?'live':'disabled';
  function finish(session,status) {
    if(!session||session.done||active!==session)return;
    session.done=true;active=null;clearTimer(session.timer);
    if(session.ad){
      try{session.ad.offClose?.(session.close);}catch{}
      try{session.ad.offError?.(session.error);}catch{}
      retiring=true;
      try{Promise.resolve(session.ad.destroy?.()).catch(()=>{retireFailed=true;}).finally(()=>{retiring=false;});}catch{retiring=false;retireFailed=true;}
    }
    session.resolve({status,requestId:session.id});
  }
  return {
    getState:()=>({mode:actualMode,available:!destroyed&&actualMode!=='disabled'&&!retiring&&!retireFailed,busy:!!active,retiring,retireFailed}),
    request({placement='revive',context=null}={}) {
      const id=`road-reward-${++serial}`;
      if(destroyed||active||retiring||retireFailed||actualMode==='disabled')return Promise.resolve({status:'unavailable',requestId:id});
      return new Promise(resolve=>{
        const session={id,placement,context,resolve,done:false,ad:null,timer:null};active=session;
        session.timer=setTimer(()=>finish(session,'error'),90000);
        if(actualMode==='mock')return;
        try{
          session.ad=api.createRewardedVideoAd({adUnitId,multiton:false});
          if(!session.ad||typeof session.ad.onClose!=='function'||typeof session.ad.onError!=='function'||typeof session.ad.show!=='function'||typeof session.ad.destroy!=='function'){finish(session,'unavailable');return;}
          session.close=res=>{
            const complete=res?.isEnded===true&&(res.count===undefined||(Number.isFinite(res.count)&&res.count>=1));
            finish(session,complete?'completed':'cancelled');
          };
          session.error=err=>finish(session,Number(err?.errCode??err?.errNo)===1004?'unavailable':'error');
          session.ad.onClose(session.close);session.ad.onError(session.error);
          Promise.resolve(session.ad.show()).catch(session.error);
        }catch{finish(session,'error');}
      });
    },
    resolveMock(status){if(actualMode==='mock'&&['completed','cancelled','unavailable','error'].includes(status))finish(active,status);},
    cancel(){finish(active,'cancelled');},
    destroy(){destroyed=true;finish(active,'cancelled');}
  };
}

// DOM access is isolated to this browser adapter. Not shipped in the tt build.
function createBrowserPlatform(canvas, host = window, audioPaths = {}) {
  const rewards=createRewardedService({mode:'mock',timers:{setTimeout:host.setTimeout?.bind(host),clearTimeout:host.clearTimeout?.bind(host)}});
  const listeners = { pointer: new Set(), resize: new Set(), pause: new Set(), resume: new Set() };
  const removers = [];
  const emit = (name, value) => listeners[name].forEach(fn => fn(value));
  const subscribe = name => fn => { listeners[name].add(fn); return () => listeners[name].delete(fn); };
  const listen = (target, name, fn) => { target.addEventListener(name, fn); removers.push(() => target.removeEventListener(name, fn)); };
  let size;
  function resize() {
    const rect = canvas.getBoundingClientRect();
    const css=typeof host.getComputedStyle==='function'?host.getComputedStyle(canvas):null;
    const safeInsets=Object.fromEntries(['top','right','bottom','left'].map(edge=>[edge,Math.max(0,parseFloat(css?.getPropertyValue?.('--safe-'+edge))||0)]));
    size = { width: rect.width, height: rect.height, dpr: Math.min(host.devicePixelRatio || 1, 3), safeInsets };
    canvas.width = Math.round(size.width * size.dpr);
    canvas.height = Math.round(size.height * size.dpr);
    emit('resize', { ...size });
  }
  resize();
  listen(host, 'resize', resize);
  for (const [event, type] of [['pointerdown','down'],['pointermove','move'],['pointerup','up'],['pointercancel','cancel']]) {
    listen(canvas, event, e => {
      if (type === 'down') canvas.setPointerCapture?.(e.pointerId);
      const rect = canvas.getBoundingClientRect();
      emit('pointer', { type, x: (e.clientX - rect.left) * size.width / rect.width, y: (e.clientY - rect.top) * size.height / rect.height, id: e.pointerId });
    });
  }
  let muted = false;
  const sounds = new Map();
  const audio = {
    play(name) {
      if (muted || !audioPaths[name]) return;
      try {
        let sound = sounds.get(name);
        if (!sound) { sound = new host.Audio(audioPaths[name]); sounds.set(name, sound); }
        sound.currentTime = 0;
        const pending = sound.play();
        if (pending?.catch) pending.catch(() => {});
      } catch { /* Audio failure must not block play. */ }
    },
    setMuted(value) { muted = Boolean(value); if (muted) sounds.forEach(sound => sound.pause()); }
  };
  listen(host,'pagehide',()=>{sounds.forEach(sound=>sound.pause());emit('pause');});
  listen(host,'pageshow',event=>{if(event.persisted){resize();emit('resume');}});
  listen(host.document, 'visibilitychange', () => {
    if (host.document.hidden) { sounds.forEach(sound => sound.pause()); emit('pause'); }
    else { resize(); emit('resume'); }
  });

    canvas, getSize: () => ({ ...size, safeInsets:{...size.safeInsets} }),
    onPointer: subscribe('pointer'), onResize: subscribe('resize'), onPause: subscribe('pause'), onResume: subscribe('resume'),
    requestFrame: fn => host.requestAnimationFrame(fn), cancelFrame: id => host.cancelAnimationFrame(id),
    storage: { getItem: key => host.localStorage.getItem(key), setItem: (key, value) => host.localStorage.setItem(key, value) },
    audio, rewards,
    destroy() { rewards.destroy(); removers.forEach(fn => fn()); sounds.forEach(sound => sound.pause()); Object.values(listeners).forEach(set => set.clear()); }
